services:

  mysql:
    image: mysql:8.4
    container_name: fintrack_mysql

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: fintrack

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build: .
    container_name: fintrack_app

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fintrack
      SPRING_DATASOURCE_USERNAME: root
      DB_PASSWORD: password
      JWT_SECRET: change-this-development-secret-key-123
    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data: